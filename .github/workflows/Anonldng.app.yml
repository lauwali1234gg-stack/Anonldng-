class Scanner:

    def __init__(self, log, finding, stop_event):
        self.log = log
        self.finding = finding
        self.stop = stop_event

    def tcp_scan(self, host, port, timeout=1.5):
        try:
            s = socket.socket()
            s.settimeout(timeout)

            if s.connect_ex((host, port)) == 0:

                banner = ""

                try:
                    if port not in (22, 21):
                        s.sendall(
                            b"HEAD / HTTP/1.0\r\n"
                            b"Host: target\r\n"
                            b"Connection: close\r\n\r\n"
                        )
                    else:
                        s.sendall(b"\n")

                    s.settimeout(2)
                    banner = s.recv(512).decode(
                        "utf-8",
                        "replace"
                    ).strip()

                except Exception:
                    pass

                s.close()

                return port, banner

        except Exception:
            pass

        return None

    def scan_ports(self, host, ports):

        self.log(
            "[*] Port scan: %s (%d ports)"
            % (host, len(ports))
        )

        open_ports = []

        with cf.ThreadPoolExecutor(
            max_workers=min(100, len(ports))
        ) as ex:

            futs = {
                ex.submit(self.tcp_scan, host, p): p
                for p in ports
            }

            for f in cf.as_completed(futs):

                if self.stop.is_set():
                    break

                try:
                    r = f.result()
                except Exception:
                    continue

                if r:

                    p, banner = r
                    open_ports.append(p)

                    svc = TOP_PORTS.get(p, "?")

                    first_line = ""

                    if banner:
                        first_line = banner.splitlines()[0][:80]

                    self.log(
                        "[+] OPEN  %-5d %-12s %s"
                        % (p, svc, first_line)
                    )

                    if banner:

                        for pat, svc_name, safe_ver, hint in CVE_HINTS:

                            try:
                                m = re.search(
                                    pat,
                                    banner,
                                    re.I
                                )
                            except Exception:
                                m = None

                            if m:

                                version = (
                                    m.group(1)
                                    if m.groups()
                                    else ""
                                )

                                if (
                                    safe_ver is None
                                    or self.tuple_lt(
                                        self.vtuple(version),
                                        safe_ver
                                    )
                                ):
                                    self.finding(
                                        "HIGH",
                                        "Outdated/known-risk service: "
                                        "%s %s"
                                        % (svc_name, version),
                                        hint,
                                        "%s:%d" % (host, p)
                                    )

                    if (
                        p == 21
                        and "FTP" in banner
                        and not self.stop.is_set()
                    ):
                        self.ftp_anon(host)

                    if p in (80, 8080):
                        self.web_checks(
                            "http://%s:%d" % (host, p)
                        )

                    if p in (443, 8443):
                        self.tls_checks(host, p)
                        self.web_checks(
                            "https://%s:%d" % (host, p)
                        )

        return open_ports

    @staticmethod
    def vtuple(v):
        nums = re.findall(r"\d+", v)

        try:
            return tuple(
                int(x)
                for x in nums[:3]
            )
        except Exception:
            return (0,)

    @staticmethod
    def tuple_lt(a, b):

        aa = tuple(a) + (0,) * (3 - len(a))
        bb = tuple(b) + (0,) * (3 - len(b))

        return aa[:3] < bb[:3]

    def ftp_anon(self, host):

        try:

            s = socket.create_connection(
                (host, 21),
                timeout=5
            )

            s.recv(256)

            s.sendall(
                b"USER anonymous\r\n"
            )

            r1 = s.recv(256)

            if not r1:
                s.close()
                return

            s.sendall(
                b"PASS probe@example.com\r\n"
            )

            r2 = s.recv(256).decode(
                "utf-8",
                "replace"
            )

            s.close()

            if r2.startswith("230"):

                self.finding(
                    "HIGH",
                    "Anonymous FTP login allowed",
                    "Server accepts anonymous credentials; data exposure risk.",
                    "%s:21" % host
                )

                self.log(
                    "[!] FTP anonymous login accepted"
                )

        except Exception:
            pass

    def tls_checks(self, host, port=443):

        try:

            c = ssl.create_default_context()

            with socket.create_connection(
                (host, port),
                timeout=6
            ) as sock:

                with c.wrap_socket(
                    sock,
                    server_hostname=host
                ) as ss:

                    cert = ss.getpeercert()

                    issuer = dict(
                        x[0]
                        for x in cert.get(
                            "issuer",
                            []
                        )
                    ).get(
                        "organizationName",
                        "?"
                    )

                    self.log(
                        "[*] TLS OK: %s | issuer: %s"
                        % (
                            ss.version(),
                            issuer
                        )
                    )

                    if "notAfter" in cert:

                        try:

                            exp = datetime.datetime.strptime(
                                cert["notAfter"],
                                "%b %d %H:%M:%S %Y %Z"
                            )

                            days = (
                                exp
                                - datetime.datetime.utcnow()
                            ).days

                            if days < 15:

                                self.finding(
                                    "MEDIUM"
                                    if days > 0
                                    else "HIGH",
                                    "TLS certificate %s (%d days)"
                                    % (
                                        "expiring"
                                        if days > 0
                                        else "EXPIRED",
                                        days
                                    ),
                                    "Cert notAfter: %s" % exp,
                                    "%s:%d" % (
                                        host,
                                        port
                                    )
                                )

                        except Exception:
                            pass

            try:

                weak = ssl.SSLContext(
                    ssl.PROTOCOL_TLS
                )

                weak.maximum_version = (
                    ssl.TLSVersion.TLSv1_1
                )

                with socket.create_connection(
                    (host, port),
                    timeout=5
                ) as sock:

                    weak.wrap_socket(
                        sock,
                        server_hostname=host
                    )

                self.finding(
                    "MEDIUM",
                    "Deprecated TLS versions accepted",
                    "Server may negotiate TLS 1.0/1.1.",
                    "%s:%d" % (host, port)
                )

            except Exception:
                pass

        except ssl.SSLCertVerificationError:

            self.finding(
                "MEDIUM",
                "Invalid/self-signed TLS certificate",
                "Certificate chain fails verification.",
                "%s:%d" % (host, port)
            )

        except Exception as e:

            self.log(
                "[-] TLS check failed: %s"
                % e
            )

    def web_checks(self, base):

        if requests is None:
            self.log(
                "[-] requests is not installed."
            )
            return

        if self.stop.is_set():
            return

        self.log(
            "[*] Web checks: %s"
            % base
        )

        try:

            r = requests.get(
                base,
                headers=UA,
                timeout=8,
                verify=False,
                allow_redirects=True
            )

        except Exception as e:

            self.log(
                "[-] HTTP fail: %s"
                % e
            )

            return

        h = r.headers
        body = r.text[:6000]

        missing = [
            x
            for x in SEC_HEADERS
            if x not in h
        ]

        if missing:

            self.finding(
                "LOW",
                "Missing security headers (%d)"
                % len(missing),
                ", ".join(missing),
                base
            )

        csp = h.get(
            "Content-Security-Policy",
            ""
        )

        if (
            "unsafe-inline" in csp
            or "unsafe-eval" in csp
        ):

            self.finding(
                "MEDIUM",
                "Weak CSP (unsafe-inline/eval)",
                csp[:120],
                base
            )

        cookie_header = h.get(
            "Set-Cookie",
            ""
        )

        for ck in cookie_header.split("\n"):

            if (
                ck
                and "httponly" not in ck.lower()
            ):

                self.finding(
                    "MEDIUM",
                    "Cookie without HttpOnly",
                    ck[:120],
                    base
                )

        if re.search(
            r"<title>\s*Index of /",
            body,
            re.I
        ):

            self.finding(
                "HIGH",
                "Directory listing enabled",
                "Autoindex exposes file tree.",
                base
            )

        server = h.get(
            "Server"
        )

        if server:

            self.log(
                "[*] Server: %s"
                % server
            )

        self.path_fuzz(base)

        if self.active_enabled():
            self.active_checks(base)

    def active_enabled(self):
        return getattr(
            self,
            "_active_enabled",
            False
        )

    def set_active(self, enabled):
        self._active_enabled = enabled

    def path_fuzz(self, base):

        if requests is None:
            return

        for path in SUSPECT_PATHS:

            if self.stop.is_set():
                return

            try:

                r = requests.get(
                    base + path,
                    headers=UA,
                    timeout=6,
                    verify=False
                )

                if r.status_code == 200 and len(r.text) > 0:

                    sig = ""

                    if (
                        path == "/.git/HEAD"
                        and "ref:" in r.text[:64]
                    ):
                        sig = "exposed git repository"

                    elif (
                        path == "/.env"
                        and re.search(
                            r"[A-Z_]+=",
                            r.text
                        )
                    ):
                        sig = "environment/secrets file"
n
                    elif (
                        "phpinfo" in path
                        and "PHP Version" in r.text
                    ):
                        sig = "phpinfo() exposure"

                    elif (
                        path == "/server-status"
                        and "Apache Status" in r.text
                    ):
                        sig = "Apache server-status exposed"

                    elif (
                        path == "/actuator/health"
                        and '"status"' in r.text
                    ):
                        sig = "Spring Boot actuator"

                    elif (
                        "swagger" in path
                        and "swagger" in r.text.lower()
                    ):
                        sig = "API documentation exposed"

                    if sig:

                        self.finding(
                            "HIGH",
                            "Sensitive path exposed: %s"
                            % path,
                            sig,
                            base + path
                        )

                    elif path in (
                        "/backup.zip",
                        "/backup.sql",
                        "/dump.sql",
                        "/.htaccess",
                        "/wp-config.php.bak"
                    ):

                        self.finding(
                            "MEDIUM",
                            "Possible backup/sensitive file: "
                            "%s (verify)" % path,
                            "HTTP 200, %d bytes"
                            % len(r.text),
                            base + path
                        )

            except Exception:
                pass

    def active_checks(self, base):

        if requests is None:
            return

        if self.stop.is_set():
            return

        # Safe reflected-input check
        try:

            marker = "VULNSCAN_REFLECTION_TEST_123"

            url = base

            separator = (
                "&"
                if "?" in url
                else "?"
            )

            test_url = (
                url
                + separator
                + "q="
                + marker
            )

            r = requests.get(
                test_url,
                headers=UA,
                timeout=6,
                verify=False
            )

            if marker in r.text:

                self.finding(
                    "MEDIUM",
                    "Reflected input detected",
                    "A harmless marker was reflected in the response; review output encoding.",
                    test_url
                )

        except Exception:
            pass

        # SQL error signature check
        try:

            r = requests.get(
                base + "?q=test%27",
                headers=UA,
                timeout=6,
                verify=False
            )

            for sig in SQL_ERRORS:

                if re.search(
                    sig,
                    r.text,
                    re.I
                ):

                    self.finding(
                        "HIGH",
                        "Possible SQL error exposure",
                        "Database error signature detected: %s"
                        % sig,
                        base
                    )

                    break

        except Exception:
            pass

        # Open redirect check
        try:

            for pname in (
                "next",
                "redirect",
                "url",
                "return",
                "goto"
            ):

                if self.stop.is_set():
                    return

                r = requests.get(
                    "%s/?%s=https://example.invalid/"
                    % (base, pname),
                    headers=UA,
                    timeout=6,
                    verify=False,
                    allow_redirects=False
                )

                loc = r.headers.get(
                    "Location",
                    ""
                )

                if (
                    r.status_code in (301, 302)
                    and "example.invalid" in loc
                ):

                    self.finding(
                        "MEDIUM",
                        "Possible open redirect via '%s'"
                        % pname,
                        "Redirects to: %s" % loc,
                        base
                    )

        except Exception:
            pass


