            0,
            weight=1
        )

        self.prog = ttk.Progressbar(
            root,
            mode="indeterminate"
        )

        self.prog.pack(
            fill="x"
        )

        nb = ttk.Notebook(
            root
        )

        nb.pack(
            fill="both",
            expand=True
        )

        self.logbox = scrolledtext.ScrolledText(
            nb,
            bg="#111",
            fg="#0f0",
            font=("monospace", 10)
        )

        self.find_tb = ttk.Treeview(
            nb,
            columns=(
                "sev",
                "title",
                "target"
            ),
            show="headings"
        )

        for c, w in (
            ("sev", 90),
            ("title", 380),
            ("target", 220)
        ):

            self.find_tb.column(
                c,
                width=w
            )

            self.find_tb.heading(
                c,
                text=c.title()
            )

        for sev, col in (
            ("CRITICAL", "#b00"),
            ("HIGH", "#e60"),
            ("MEDIUM", "#cc0"),
            ("LOW", "#088")
        ):

            self.find_tb.tag_configure(
                sev,
                foreground=col
            )

        self.summary = scrolledtext.ScrolledText(
            nb,
            font=("monospace", 10)
        )

        nb.add(
