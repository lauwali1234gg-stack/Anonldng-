        )

        nb.add(
            self.find_tb,
            text="Findings"
        )

        nb.add(
            self.summary,
            text="Summary"
        )

        self.root.after(
            100,
            self.pump
        )

    # TARGET BUTTON ACTION
    def focus_target(self):

        self.target.focus_set()

        self.target.selection_range(
            0,
            tk.END
        )

    def plog(self, msg):
        self.q.put(
            ("log", msg)
        )

    def add_finding(
        self,
        sev,
        title,
        detail,
        target
    ):

        self.q.put(
            (
                "find",
                (
                    sev,
                    title,
                    detail,
                    target
                )
            )
        )

    def pump(self):

        try:

            while True:

                kind, val = (
                    self.q.get_nowait()
                )

                if kind == "log":

                    self.logbox.insert(
                        "end",
                        val + "\n"
                    )

                    self.logbox.see(
                        "end"
                    )

                else:

                    sev, title, detail, target = val

                    self.findings.append(
                        val
                    )

                    self.find_tb.insert(
                        "",
                        "end",
                        values=(
                            sev,
                            title,
                            target
                        ),
                        tags=(sev,)
                    )

        except queue.Empty:
            pass

        self.root.after(
            100,
            self.pump
        )

    def start(self):

        target = (
            self.target.get()
            .strip()
        )

        if not target:

            messagebox.showerror(
                "Input",
                "Enter a target."
            )

            return

        # Clear previous findings
        self.findings.clear()

        for item in self.find_tb.get_children():
            self.find_tb.delete(item)

        self.summary.delete(
            "1.0",
            "end"
        )

        self.stop.clear()

        self.b_start.config(
            state="disabled"
        )

        self.prog.start(
            12
        )

        threading.Thread(
            target=self.run,
            daemon=True
        ).start()

    def stop_scan(self):

        self.stop.set()

        self.b_start.config(
            state="normal"
        )

        self.prog.stop()

        self.plog(
            "[*] Stop requested."
        )

    def run(self):

        try:

            t = (
                self.target.get()
                .strip()
            )

            t = re.sub(
                r"^https?://",
                "",
                t,
                flags=re.I
            )

            t = t.split("/")[0]

            sc = Scanner(
                self.plog,
                self.add_finding,
                self.stop
            )

            sc.set_active(
                self.opts["active"].get()
            )

            self.plog(
                "[*] Resolving %s ..."
                % t
            )

            try:

                host = socket.gethostbyname(
                    t
                )

            except Exception:

                self.plog(
                    "[!] DNS resolution failed."
                )

                return

            self.plog(
                "[+] %s -> %s"
                % (t, host)
            )

            open_ports = []

            if self.opts["ports"].get():

                open_ports = sc.scan_ports(
                    host,
                    sorted(TOP_PORTS)
                )

            if self.stop.is_set():
                return

            web_found = any(
                p in (80, 443, 8080, 8443)
                for p in open_ports
            )

            if (
                self.opts["web"].get()
                and not web_found
            ):

                self.plog(
                    "[*] No web port detected; "
                    "trying HTTP/HTTPS checks."
                )

                sc.web_checks(
                    "http://" + t
                )

                if not self.stop.is_set():

                    sc.web_checks(
                        "https://" + t
                    )

            if (
                self.opts["tls"].get()
                and not self.stop.is_set()
            ):

                sc.tls_checks(
                    t
                )

            if not self.stop.is_set():

                self.plog(
                    "[*] Scan complete. %d findings."
                    % len(self.findings)
                )

                self.summarize()

        except Exception as e:

            self.plog(
                "[!] ERROR: %s"
                % e
            )

        finally:

            self.root.after(
                0,
                self.scan_finished
            )

    def scan_finished(self):

        self.b_start.config(
            state="normal"
        )

        self.prog.stop()

    def summarize(self):

        from collections import Counter

        c = Counter(
            f[0]
            for f in self.findings
        )

        self.summary.delete(
            "1.0",
            "end"
        )

        self.summary.insert(
            "end",
            "SCAN SUMMARY  %s\n%s\n"
            % (
                datetime.datetime.now().strftime(
                    "%Y-%m-%d %H:%M"
                ),
                "=" * 50
            )
        )

        for sev in (
            "CRITICAL",
            "HIGH",
            "MEDIUM",
            "LOW"
        ):

            self.summary.insert(
                "end",
                "  %-8s %d\n"
                % (
                    sev,
                    c.get(sev, 0)
                )
            )

        self.summary.insert(
            "end",
            "=" * 50
            + "\n\n"
        )

        for (
            sev,
            title,
            detail,
            target
        ) in self.findings:

            self.summary.insert(
                "end",
                "[%s] %s\n"
                "   %s\n"
                "   Target: %s\n\n"
                % (
                    sev,
                    title,
                    detail,
                    target
                )
            )

    def report(self):

        if not self.findings:

            messagebox.showinfo(
                "Report",
                "No findings yet."
            )

            return

        sev_col = {
            "CRITICAL": "#c00",
            "HIGH": "#e60",
            "MEDIUM": "#cc0",
            "LOW": "#077"
        }

        rows = ""

        for (
            s,
            t,
            d,
            g
        ) in self.findings:

            rows += (
                "<tr>"
                "<td style='color:%s'>"
                "<b>%s</b>"
                "</td>"
                "<td>%s<br>"
                "<small>%s</small>"
                "</td>"
                "<td>%s</td>"
                "</tr>"
                %
                (
                    sev_col.get(
                        s,
                        "#000"
                    ),
                    html.escape(s),
                    html.escape(t),
                    html.escape(d),
                    html.escape(g)
                )
            )

        doc = (
            "<html>"
            "<head>"
            "<meta charset='utf-8'>"
            "<title>VulnScan Pro Report</title>"
            "<style>"
            "body{font-family:monospace}"
            "table{border-collapse:collapse;width:100%}"
            "td{border:1px solid #ccc;padding:6px}"
            "</style>"
            "</head>"
            "<body>"
            "<h1>Vulnerability Assessment Report</h1>"
            "<p>"
            "Generated: %s<br>"
            "Target: %s | "
            "Total findings: %d"
            "</p>"
            "<table>%s</table>"
            "</body>"
            "</html>"
        ) % (
            datetime.datetime.now().isoformat(),
            html.escape(
                self.target.get()
            ),
            len(self.findings),
            rows
        )

        try:

            os.makedirs(
                DOWNLOAD,
                exist_ok=True
            )

            out = os.path.join(
                DOWNLOAD,
                "vulnscan_report_%s.html"
                % datetime.datetime.now().strftime(
                    "%Y%m%d_%H%M%S"
                )
            )

            with open(
                out,
                "w",
                encoding="utf-8"
            ) as f:

                f.write(doc)

            messagebox.showinfo(
                "Report saved",
                out
            )

        except Exception as e:

            messagebox.showerror(
                "Report Error",
                str(e)
            )


if __name__ == "__main__":

    root = tk.Tk()

    App(root)

    root.mainloop()
